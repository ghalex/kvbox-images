# Valkey in a kvbox redis box (kvbox #176). The same in every box; what differs per box is in the two
# files included at the end, written by kvbox-redis-init at the first boot (and kvbox-auth.conf again
# by kvbox-redis-password). maxmemory is given on the command line by kvbox-redis-run at every start.

# Every address: the host firewall decides who reaches a box (isolated unless linked). Nobody gets in
# without the password (kvbox-auth.conf), which is also why protected mode has nothing to add.
bind * -::*
protected-mode no
port 6379
unixsocket /run/valkey/valkey.sock
unixsocketperm 770

daemonize no
supervised systemd
logfile ""
tcp-keepalive 300

# A database, not only a cache: every write goes to the append-only file, synced once a second, so a
# crash loses at most that second. The AOF is the persistence; no RDB snapshots on a timer beside it.
appendonly yes
appendfsync everysec
appenddirname "appendonlydir"
save ""

# Full means writes are refused, never that keys disappear.
maxmemory-policy noeviction

# kvbox-redis-init: dir, tls-port 6380 and this box's certificate.
include /etc/valkey/kvbox.conf
# kvbox-redis-init, kvbox-redis-password: requirepass.
include /etc/valkey/kvbox-auth.conf
